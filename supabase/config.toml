project_id = "Night_life"

[functions.verification]
# Publishable-key clients: verify their bearer token inside requireUser/getUser.
verify_jwt = false

[functions.yoti-webhook]
# Provider calls carry an RSA-PSS signature, never a Supabase user JWT.
verify_jwt = false

[functions.veriff-webhook]
# Provider calls carry an HMAC-SHA256 of the raw body, never a Supabase user JWT.
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false # requireUser validates the bearer token with Supabase Auth.
[functions.billing-account]
verify_jwt = false # requireUser validates the bearer token with Supabase Auth.
[functions.create-portal-session]
verify_jwt = false # requireUser validates the bearer token with Supabase Auth.
[functions.request-withdrawal]
verify_jwt = false # requireUser validates the bearer token with Supabase Auth.
[functions.delete-account]
verify_jwt = false # Verified bearer plus a recent authentication method.
[functions.stripe-webhook]
verify_jwt = false # Stripe signature over the bounded original request body.
[functions.billing-worker]
verify_jwt = false # Vault key validated inside the service-only claim RPC.
[functions.signed-documents]
verify_jwt = false # requireUser validates the bearer token with Supabase Auth.
[functions.store]
verify_jwt = false # requireUser validates the bearer token with Supabase Auth (Block 11b).
[functions.store-admin]
verify_jwt = false # requireUser + admin with MFA checked by the store_admin_catalog RPC.
[functions.revenuecat-webhook]
verify_jwt = false # RevenueCat Authorization header (REVENUECAT_WEBHOOK_AUTH), never a user JWT.
